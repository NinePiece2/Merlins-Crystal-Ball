name: autofix.ci
on:
  pull_request:
  push:
    branches:
      - main
permissions: {}
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
      - run: |
          npm ci
          npx prettier --write .
      - uses: autofix-ci/action@v1.3.4
        with:
          commit-message: "Apply Prettier format"
